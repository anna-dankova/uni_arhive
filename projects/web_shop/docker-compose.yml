services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: shop_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: trgovina
      MYSQL_USER: trgovina_user
      MYSQL_PASSWORD: MocnoGeslo123!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/shema.sql:/docker-entrypoint-initdb.d/shema.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: shop_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
